<!--
心电图 / 生命周期追踪模板 (Lifecycle Trace)
用途：表达"某个实体在时间维度上的状态变化 + 死亡点"
特征：左侧事件清单 + 右侧案例追踪 + 底部洞察盒 + 衍生指标卡
-->
<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- ============ 顶部 banner ============ -->
  <rect x="0" y="0" width="1000" height="50" fill="#7d3c98"/>
  <text x="500" y="32" text-anchor="middle" fill="white" font-size="20" font-weight="700">💓 {{机制名}}：{{核心一句话描述}}</text>

  <!-- ============ 左半部分：事件类型清单 ============ -->
  <g transform="translate(20, 80)">
    <text x="0" y="20" font-size="16" font-weight="700">事件类型（{{N}} 种）</text>

    <!-- 事件 1 -->
    <g transform="translate(0, 40)">
      <rect width="440" height="65" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
      <rect width="8" height="65" fill="#7d3c98"/>
      <text x="20" y="22" font-size="13" font-weight="700">① {{事件 1 名}}（{{语义说明}}）</text>
      <text x="20" y="42" font-size="11" fill="#555">何时：{{触发时机}}</text>
      <text x="20" y="58" font-size="11" fill="#555">检查：{{检查内容}}</text>
    </g>

    <!-- 事件 2 -->
    <g transform="translate(0, 115)">
      <rect width="440" height="65" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
      <rect width="8" height="65" fill="#7d3c98"/>
      <text x="20" y="22" font-size="13" font-weight="700">② {{事件 2 名}}</text>
      <text x="20" y="42" font-size="11" fill="#555">何时：{{...}}</text>
      <text x="20" y="58" font-size="11" fill="#555">检查：{{...}}</text>
    </g>

    <!-- 事件 3、4、5... 复制上面结构，每个 y += 75 -->

    <!-- ============ JSON 样例（深色块）============ -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-size="13" font-weight="700">日志样例 ({{文件名}}.jsonl)</text>
      <rect x="0" y="10" width="440" height="180" fill="#1a1a1a"/>
      <text x="15" y="32" font-size="10" fill="#fff" font-family="SF Mono, Monaco, monospace">{</text>
      <text x="15" y="48" font-size="10" fill="#a6e22e" font-family="SF Mono, Monaco, monospace">  "field1": "...",</text>
      <text x="15" y="64" font-size="10" fill="#a6e22e" font-family="SF Mono, Monaco, monospace">  "field2": ...,</text>
      <text x="15" y="80" font-size="10" fill="#a6e22e" font-family="SF Mono, Monaco, monospace">  "state": "...",</text>
      <text x="15" y="96" font-size="10" fill="#f92672" font-family="SF Mono, Monaco, monospace">  "alert": true,    ← 警报！</text>
      <text x="15" y="112" font-size="10" fill="#fff" font-family="SF Mono, Monaco, monospace">}</text>
    </g>
  </g>

  <!-- ============ 右半部分：案例追踪 ============ -->
  <g transform="translate(490, 80)">
    <text x="0" y="20" font-size="16" font-weight="700">案例追踪：{{案例名}} 的命运</text>

    <g transform="translate(0, 40)">
      <rect width="490" height="540" fill="#fafaf7" stroke="#7d3c98" stroke-width="2"/>

      <!-- Stage 1（活着 - 绿色圆点）-->
      <g transform="translate(20, 30)">
        <circle cx="0" cy="0" r="14" fill="#229954" stroke="#1a1a1a" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="white" font-size="11" font-weight="700">S1</text>
        <text x="22" y="-2" font-size="12" font-weight="700">{{状态 1}} ✓</text>
        <text x="22" y="14" font-size="10" fill="#555">{{说明}}</text>
      </g>
      <line x1="20" y1="50" x2="20" y2="90" stroke="#229954" stroke-width="3"/>

      <!-- Stage 2 -->
      <g transform="translate(20, 100)">
        <circle cx="0" cy="0" r="14" fill="#229954" stroke="#1a1a1a" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="white" font-size="11" font-weight="700">S2</text>
        <text x="22" y="-2" font-size="12" font-weight="700">{{状态 2}} ✓</text>
        <text x="22" y="14" font-size="10" fill="#555">{{说明}}</text>
      </g>
      <line x1="20" y1="120" x2="20" y2="160" stroke="#229954" stroke-width="3"/>

      <!-- ... 继续 Stage 3、4 ... -->

      <!-- 死亡点（红色圆点 + "死亡点！"标注）-->
      <g transform="translate(20, 310)">
        <circle cx="0" cy="0" r="14" fill="#229954" stroke="#1a1a1a" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="white" font-size="11" font-weight="700">S5</text>
        <text x="22" y="-2" font-size="12" font-weight="700">{{状态 5}} ✗ 🚨</text>
        <text x="22" y="14" font-size="10" fill="#c0392b" font-weight="700">死亡点！{{死亡描述}}</text>
        <text x="22" y="28" font-size="10" fill="#c0392b">{{具体原因}}</text>
      </g>
      <line x1="20" y1="345" x2="20" y2="380" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,4"/>

      <!-- 死亡之后 -->
      <g transform="translate(20, 390)">
        <circle cx="0" cy="0" r="14" fill="#c0392b" stroke="#1a1a1a" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" fill="white" font-size="11" font-weight="700">S6</text>
        <text x="22" y="-2" font-size="12" font-weight="700">{{后果状态}} ❌</text>
        <text x="22" y="14" font-size="10" fill="#c0392b">{{后果说明}}</text>
      </g>
    </g>

    <!-- 洞察盒（黄色框）-->
    <g transform="translate(0, 600)">
      <rect width="490" height="155" fill="#fff8e7" stroke="#d68910" stroke-width="2"/>
      <text x="15" y="25" font-size="14" font-weight="700" fill="#d68910">🔍 心电图揭示的洞察</text>
      <text x="15" y="50" font-size="12">如果没有这个机制：{{治标方式}}</text>
      <text x="15" y="70" font-size="12">有了这个机制：发现死亡点在 <tspan font-weight="700">{{真实死亡点}}</tspan></text>
      <text x="15" y="90" font-size="12">→ 真正要修的是 <tspan font-weight="700">{{真正的修复对象}}</tspan></text>
      <text x="15" y="135" font-size="12" font-weight="700" fill="#c0392b">这是"治标 vs 治本"的关键区别</text>
    </g>
  </g>

  <!-- ============ 底部：衍生指标卡（4 列网格）============ -->
  <g transform="translate(20, 800)">
    <text x="0" y="20" font-size="16" font-weight="700">从{{机制名}}衍生的 4 个指标</text>

    <g transform="translate(0, 40)">
      <rect width="232" height="170" fill="#fff" stroke="#7d3c98" stroke-width="2"/>
      <rect width="232" height="32" fill="#7d3c98"/>
      <text x="116" y="22" text-anchor="middle" fill="white" font-size="12" font-weight="700">① {{指标 1}}</text>
      <foreignObject x="10" y="42" width="212" height="120">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;line-height:1.45;font-family:sans-serif;">
          <b>说人话：</b>{{...}}<br><br>
          <b>产出：</b>{{...}}<br>
          <b>价值：</b>{{...}}
        </div>
      </foreignObject>
    </g>

    <!-- 复制：translate x = 247, 494, 741 -->
  </g>

  <!-- 关键理解 -->
  <g transform="translate(20, 1040)">
    <rect width="960" height="140" fill="#f0eee8" stroke="#1a1a1a" stroke-width="2"/>
    <text x="15" y="30" font-size="14" font-weight="700">💡 关键理解</text>
    <foreignObject x="15" y="40" width="930" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;line-height:1.55;font-family:sans-serif;">
        {{核心理解的两段话}}
      </div>
    </foreignObject>
  </g>
</svg>
