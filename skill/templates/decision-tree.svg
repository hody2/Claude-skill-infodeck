<!--
决策树模板 (Decision Tree, 主干+旁路)
用途：表达"给定输入 X，怎么决定它的归类/处理方式"
特征：中央粗黑主干 + 向右伸出的旁路出口
-->
<svg viewBox="0 0 1000 940" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-main-dt" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-side-dt" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ============ 顶部 banner ============ -->
  <rect x="0" y="0" width="1000" height="60" fill="#1a1a1a"/>
  <text x="500" y="38" text-anchor="middle" fill="white" font-size="18" font-weight="700">{{决策树的核心问题}}</text>

  <!-- ============ 起点 ============ -->
  <g>
    <rect x="380" y="100" width="240" height="56" rx="8" fill="#1a1a1a"/>
    <text x="500" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="700">{{输入 X 的名字}}</text>
    <text x="500" y="144" text-anchor="middle" fill="#aaa" font-size="11">（待决策）</text>
  </g>

  <line x1="500" y1="156" x2="500" y2="200" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arrow-main-dt)"/>

  <!-- ============ Q1 ============ -->
  <g>
    <rect x="320" y="200" width="360" height="80" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="500" y="228" text-anchor="middle" font-size="16" font-weight="700">Q1 · {{第一个判断问题}}</text>
    <text x="500" y="252" text-anchor="middle" font-size="16" font-weight="700">{{第一个判断问题第二行}}</text>
    <text x="500" y="271" text-anchor="middle" font-size="11" fill="#888" font-style="italic">（{{判断依据的注释}}）</text>
  </g>

  <!-- Q1 旁路 → 出口 1 -->
  <line x1="680" y1="240" x2="800" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrow-side-dt)"/>
  <text x="740" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#888">{{分支条件}}</text>

  <g>
    <rect x="800" y="210" width="170" height="60" rx="8" fill="#888" stroke="#1a1a1a" stroke-width="3"/>
    <text x="885" y="234" text-anchor="middle" fill="white" font-size="14" font-weight="700">⛔ {{出口 1}}</text>
    <text x="885" y="254" text-anchor="middle" fill="white" font-size="11">（{{出口 1 说明}}）</text>
  </g>

  <!-- Q1 → Q2 主干向下 -->
  <line x1="500" y1="280" x2="500" y2="335" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arrow-main-dt)"/>
  <text x="510" y="310" font-size="12" font-weight="700">{{主干方向标签}}</text>

  <!-- ============ Q2 ============ -->
  <g>
    <rect x="320" y="335" width="360" height="80" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="500" y="363" text-anchor="middle" font-size="16" font-weight="700">Q2 · {{第二个判断问题}}</text>
    <text x="500" y="387" text-anchor="middle" font-size="16" font-weight="700">{{第二个判断问题第二行}}</text>
    <text x="500" y="406" text-anchor="middle" font-size="11" fill="#888" font-style="italic">（{{判断依据}}）</text>
  </g>

  <!-- Q2 旁路 → 子树（如果有 Q2a） -->
  <line x1="680" y1="375" x2="785" y2="375" stroke="#888" stroke-width="2" marker-end="url(#arrow-side-dt)"/>
  <text x="740" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#888">{{分支条件}}</text>

  <!-- Q2a 子分支盒（虚线边框） -->
  <g>
    <rect x="785" y="330" width="200" height="225" rx="10" fill="#fafaf7" stroke="#888" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="885" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#555">{{子判断问题}}</text>

    <rect x="800" y="385" width="170" height="60" rx="8" fill="#888" stroke="#1a1a1a" stroke-width="3"/>
    <text x="885" y="410" text-anchor="middle" fill="white" font-size="13" font-weight="700">⛔ {{子出口 1}}</text>
    <text x="885" y="428" text-anchor="middle" fill="white" font-size="10">{{说明}}</text>

    <line x1="800" y1="465" x2="970" y2="465" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>

    <rect x="800" y="490" width="170" height="60" rx="8" fill="#229954" stroke="#1a1a1a" stroke-width="3"/>
    <text x="885" y="515" text-anchor="middle" fill="white" font-size="13" font-weight="700">📊 {{子出口 2}}</text>
    <text x="885" y="533" text-anchor="middle" fill="white" font-size="10">{{说明}}</text>
  </g>

  <!-- Q2 → Q3 主干向下 -->
  <line x1="500" y1="415" x2="500" y2="470" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arrow-main-dt)"/>

  <!-- ============ Q3 ============ -->
  <g>
    <rect x="320" y="470" width="360" height="80" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="500" y="498" text-anchor="middle" font-size="16" font-weight="700">Q3 · {{第三个判断问题}}</text>
    <text x="500" y="522" text-anchor="middle" font-size="16" font-weight="700">{{第三个判断问题第二行}}</text>
  </g>

  <!-- Q3 旁路（向左）-->
  <line x1="320" y1="510" x2="200" y2="510" stroke="#888" stroke-width="2" marker-end="url(#arrow-side-dt)"/>
  <text x="260" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#888">{{分支条件}}</text>

  <g>
    <rect x="30" y="480" width="170" height="60" rx="8" fill="#229954" stroke="#1a1a1a" stroke-width="3"/>
    <text x="115" y="504" text-anchor="middle" fill="white" font-size="14" font-weight="700">📊 {{出口 2}}</text>
    <text x="115" y="524" text-anchor="middle" fill="white" font-size="11">（{{说明}}）</text>
  </g>

  <!-- Q3 → 终点主干向下 -->
  <line x1="500" y1="550" x2="500" y2="615" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arrow-main-dt)"/>

  <!-- ============ 终点（主干结果）============ -->
  <g>
    <rect x="320" y="615" width="360" height="90" rx="10" fill="#c0392b" stroke="#1a1a1a" stroke-width="3"/>
    <text x="500" y="646" text-anchor="middle" fill="white" font-size="22" font-weight="700">🚨 {{终点名}}</text>
    <text x="500" y="672" text-anchor="middle" fill="white" font-size="13">{{终点说明}}</text>
    <text x="500" y="693" text-anchor="middle" fill="#fcc" font-size="11" font-style="italic">主干终点 · 一路活到底的输入</text>
  </g>

  <!-- ============ 配套机制说明（独立虚线框）============ -->
  <g>
    <rect x="100" y="755" width="800" height="140" rx="10" fill="#fff" stroke="#7d3c98" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="500" y="785" text-anchor="middle" font-size="16" font-weight="700" fill="#7d3c98">💓 {{配套机制名}}：是配套机制，不是归类结果</text>
    <text x="500" y="815" text-anchor="middle" font-size="13">{{配套机制说明 1}}</text>
    <text x="500" y="838" text-anchor="middle" font-size="13">{{配套机制说明 2}}</text>
    <text x="500" y="865" text-anchor="middle" font-size="13">{{配套机制说明 3}}</text>
  </g>
</svg>
