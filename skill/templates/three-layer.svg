<!--
三层架构模板 (Three-Layer Architecture Template)
用途：表达多层级体系的整体观，三层职责 + 数据流向
适用：协议栈、监控分层、组织架构等
-->
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-3l" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eee" stroke-width="1"/>
    </pattern>
    <marker id="arrow-3l" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="url(#grid-3l)"/>

  <!-- ============ 第一层 ============ -->
  <g>
    <rect x="60" y="40" width="880" height="180" fill="#fff" stroke="#c0392b" stroke-width="4"/>
    <rect x="60" y="40" width="200" height="180" fill="#c0392b"/>
    <text x="160" y="115" text-anchor="middle" fill="white" font-size="32" font-weight="900">{{Icon1}}</text>
    <text x="160" y="155" text-anchor="middle" fill="white" font-size="20" font-weight="700">{{Layer1标题}}</text>
    <text x="160" y="185" text-anchor="middle" fill="white" font-size="16">{{Layer1副标题}}</text>

    <text x="290" y="80" font-size="18" font-weight="700" fill="#c0392b">{{Layer1 主旨}}</text>
    <text x="290" y="110" font-size="14" fill="#1a1a1a">触发反应：{{发现异常时做什么}}</text>
    <text x="290" y="135" font-size="14" fill="#1a1a1a">判定方式：{{用什么手段判定}}</text>
    <text x="290" y="160" font-size="14" fill="#1a1a1a">指标数量：{{N 个}}</text>
    <text x="290" y="195" font-size="13" fill="#555" font-style="italic">例：{{典型场景一句话}}</text>
  </g>

  <!-- 层间箭头 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M 250 220 L 250 280" marker-end="url(#arrow-3l)"/>
    <text x="270" y="255" font-size="11" fill="#555">{{箭头语义 1}}</text>
    <path d="M 750 280 L 750 220" marker-end="url(#arrow-3l)"/>
    <text x="770" y="255" font-size="11" fill="#555">{{箭头语义 2}}</text>
  </g>

  <!-- ============ 第二层 ============ -->
  <g>
    <rect x="60" y="280" width="880" height="180" fill="#fff" stroke="#7d3c98" stroke-width="4"/>
    <rect x="60" y="280" width="200" height="180" fill="#7d3c98"/>
    <text x="160" y="355" text-anchor="middle" fill="white" font-size="32" font-weight="900">{{Icon2}}</text>
    <text x="160" y="395" text-anchor="middle" fill="white" font-size="20" font-weight="700">{{Layer2标题}}</text>
    <text x="160" y="425" text-anchor="middle" fill="white" font-size="16">{{Layer2副标题}}</text>

    <text x="290" y="320" font-size="18" font-weight="700" fill="#7d3c98">{{Layer2 主旨}}</text>
    <text x="290" y="350" font-size="14" fill="#1a1a1a">触发反应：{{...}}</text>
    <text x="290" y="375" font-size="14" fill="#1a1a1a">核心价值：{{...}}</text>
    <text x="290" y="400" font-size="14" fill="#1a1a1a">指标数量：{{N 个}}</text>
    <text x="290" y="435" font-size="13" fill="#555" font-style="italic">例：{{...}}</text>
  </g>

  <!-- 层间向下箭头 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M 500 460 L 500 520" marker-end="url(#arrow-3l)"/>
    <text x="520" y="495" font-size="11" fill="#555">数据沉淀</text>
  </g>

  <!-- ============ 第三层 ============ -->
  <g>
    <rect x="60" y="520" width="880" height="180" fill="#fff" stroke="#229954" stroke-width="4"/>
    <rect x="60" y="520" width="200" height="180" fill="#229954"/>
    <text x="160" y="595" text-anchor="middle" fill="white" font-size="32" font-weight="900">{{Icon3}}</text>
    <text x="160" y="635" text-anchor="middle" fill="white" font-size="20" font-weight="700">{{Layer3标题}}</text>
    <text x="160" y="665" text-anchor="middle" fill="white" font-size="16">{{Layer3副标题}}</text>

    <text x="290" y="560" font-size="18" font-weight="700" fill="#229954">{{Layer3 主旨}}</text>
    <text x="290" y="590" font-size="14" fill="#1a1a1a">触发反应：{{...}}</text>
    <text x="290" y="615" font-size="14" fill="#1a1a1a">价值：{{...}}</text>
    <text x="290" y="640" font-size="14" fill="#1a1a1a">指标数量：{{N 个}}</text>
    <text x="290" y="675" font-size="13" fill="#555" font-style="italic">例：{{...}}</text>
  </g>
</svg>
